name: ci
on:
  pull_request:
permissions:
  contents: read
jobs:
  swift:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - run: python3 .github/probe/bisect.py
