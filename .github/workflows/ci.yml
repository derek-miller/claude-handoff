name: ci
on:
  pull_request:
permissions:
  contents: read
jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - run: swift build --build-tests -Xswiftc -disable-batch-mode -j 1 2>&1 | grep -vE "warning:|^\s+[0-9]+ \||^\s+\|" | tail -200
