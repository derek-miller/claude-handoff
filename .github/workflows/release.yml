name: release
# Push a tag like v1.0.0 to build, sign, notarize and publish Claude Handoff with a Sparkle appcast.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Version from tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          [[ "$v" =~ ^([0-9]+)\.([0-9]{1,2})\.([0-9]{1,2})$ ]] || { echo "tag must look like v1.2.3, minor and patch under 100"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
          # Sparkle orders updates by this number, so it must rise with every release.
          echo "BUILD=$(( BASH_REMATCH[1] * 10000 + 10#${BASH_REMATCH[2]} * 100 + 10#${BASH_REMATCH[3]} ))" >> "$GITHUB_ENV"
      - name: Tests
        run: swift test
      - name: Import Developer ID certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"; pw="$(uuidgen)"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security import "$RUNNER_TEMP/id.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/id.p12"
          identity="$(security find-identity -v -p codesigning "$kc" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          [ -n "$identity" ] || { echo "no Developer ID Application identity in DEVELOPER_ID_P12"; exit 1; }
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Build app
        env:
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: |
          [ -n "$SPARKLE_PUBLIC_KEY" ] || { echo "set the SPARKLE_PUBLIC_KEY repository variable"; exit 1; }
          scripts/build-app.sh
      - name: Notarize and staple
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          notarize() { xcrun notarytool submit "$1" --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --team-id "$TEAM_ID" --wait; }
          ditto -c -k --keepParent "dist/Claude Handoff.app" dist/app.zip
          notarize dist/app.zip
          xcrun stapler staple "dist/Claude Handoff.app"
          scripts/make-dmg.sh "dist/Claude-Handoff-$VERSION.dmg"
          codesign --force --timestamp --sign "$SIGN_IDENTITY" "dist/Claude-Handoff-$VERSION.dmg"
          notarize "dist/Claude-Handoff-$VERSION.dmg"
          xcrun stapler staple "dist/Claude-Handoff-$VERSION.dmg"
          spctl --assess --type open --context context:primary-signature -v "dist/Claude-Handoff-$VERSION.dmg"
          rm "$RUNNER_TEMP/notary.p8" dist/app.zip
      - name: Appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body > dist/notes.md
          dmg="dist/Claude-Handoff-$VERSION.dmg"
          sign_update="$(find .build/artifacts -name sign_update -type f -perm +111 | head -1)"
          signature="$(echo "$SPARKLE_ED_PRIVATE_KEY" | "$sign_update" --ed-key-file - "$dmg")"
          url="https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME/$(basename "$dmg")"
          release="https://github.com/${{ github.repository }}/releases/tag/$GITHUB_REF_NAME"
          scripts/appcast.sh "$VERSION" "$BUILD" "$url" "$signature" dist/notes.md "$release" > dist/appcast.xml
          cat dist/appcast.xml
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/Claude-Handoff-$VERSION.dmg" dist/appcast.xml \
            --title "Claude Handoff $VERSION" --notes-file dist/notes.md --verify-tag
      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
